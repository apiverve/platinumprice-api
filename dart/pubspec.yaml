name: apiverve_platinumprice
description: "Platinum Price retrieves real-time spot rates for platinum per troy ounce, gram, and kilogram. Each response reports prices in USD, 24-hour net price changes, direction markers, and update timestamps; paid plans add 172 currencies, 7- and 30-day changes, 30-day stats, and hourly and daily history."
version: 1.2.6
homepage: https://apiverve.com/marketplace/platinumprice?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/platinumprice-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
