openapi: 3.0.4
info:
  title: Platinum Price
  description: >-
    Platinum Price retrieves real-time spot rates for platinum per troy ounce,
    gram, and kilogram. Each response reports prices in USD, 24-hour net price
    changes, direction markers, and update timestamps; paid plans add 172
    currencies, 7- and 30-day changes, 30-day stats, and hourly and daily
    history.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/platinumprice:
    get:
      summary: Platinum Price
      description: >-
        Get the current price of platinum. You can optionally specify a currency
        (defaults to USD).
      operationId: platinumprice
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          required: false
          description: The currency to get the price in
          example: USD
        - name: hourly
          in: query
          schema:
            type: boolean
          required: false
          description: Include hourly price data for the past 24 hours
          example: true
        - name: daily
          in: query
          schema:
            type: boolean
          required: false
          description: Include the daily closing price per ounce for the last 30 days
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
